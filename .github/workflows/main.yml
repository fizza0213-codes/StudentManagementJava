name: Java CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout your repository code onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up the Java JDK environment (change version if needed, e.g., 17 or 21)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Build and test with Maven (or replace with gradle if using gradle)
    - name: Build with Maven
      run: mvn clean install

    # 4. Optional: Add your deployment steps here for CD
    # - name: Deploy to Server
    #   run: echo "Add your deployment commands or actions here"
